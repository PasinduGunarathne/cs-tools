schemaVersion: 1.2

endpoints:
  # The service's single endpoint: the SSE routes plus GET /health (Choreo's
  # liveness probe; unauthenticated, see middleware.Auth). The SSE connection
  # is long-lived, so this port has WriteTimeout/IdleTimeout disabled; that is
  # harmless for the tiny /health handler. Mirrors
  # apps/customer-portal/backend-v2's websocket endpoint (WS_PORT, its own
  # Choreo entry), though this one is still a REST-style HTTP GET
  # (Server-Sent Events), not a protocol upgrade.
  - name: csm-portal-activity-stream
    displayName: CSM Portal Case Activity Stream
    service:
      basePath: /
      port: 9092
    type: REST
    networkVisibilities:
      - Public
    schemaFilePath: openapi-stream.yaml
