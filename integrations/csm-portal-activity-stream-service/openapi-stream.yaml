openapi: 3.0.1
info:
  title: CSM Portal Case Activity Stream
  description: >
    Server-Sent Events endpoint served by csm-portal-activity-stream-service's
    dedicated :9092 listener (see cmd/server/main.go). Behind the same JWT
    auth as every other endpoint except `/health`.
  version: 1.0.0
security:
  - jwtAssertion: []
servers:
  - url: "{server}:{port}/"
    variables:
      server:
        default: http://localhost
      port:
        default: "9092"
paths:
  /health:
    get:
      summary: Health check.
      description: Liveness probe. Returns 200 OK if the service is running. No auth required.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
  /cases/activities/stream:
    get:
      summary: Live activity updates for several cases on one connection.
      description: >
        Like `/cases/{id}/activities/stream`, but one Server-Sent Events
        connection covers up to 20 distinct case ids. Each `case_updated`
        event carries its `caseId` in the data payload. Every id is checked
        against the caller's read access before subscribing; ids the caller
        cannot read (or that do not exist for them) are silently dropped from
        the subscription and never produce events. If none of the ids is
        readable the upstream 403/404 is returned; any other upstream failure
        fails the whole request. Returns 503 when Event Hub isn't configured on
        the service.
      operationId: getCasesActivitiesStream
      parameters:
        - name: ids
          in: query
          description: >
            Comma-separated case UUIDs. Duplicates are ignored; at most 20
            distinct ids.
          required: true
          schema:
            type: string
        - name: x-user-id-token
          in: header
          description: >
            Forwarded to upstream entity-service calls as the caller's
            identity for per-case ACL checks. Optional — falls back to the
            x-jwt-assertion value itself when absent (see middleware.Auth).
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Ok
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: BadRequest (missing, malformed or more than 20 ids)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "503":
          description: ServiceUnavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
  /cases/{id}/activities/stream:
    get:
      summary: Live case-activity updates.
      description: >
        Opens a long-lived Server-Sent Events connection. Emits a
        `case_updated` event (data: a compact JSON object, at minimum
        `{caseId, type, timestamp}` — never comment text, field values, names
        or emails) whenever the case gets a new comment or its status,
        assignee, severity or acknowledgement changes; a
        comment-only `: ping` heartbeat every 15s otherwise. Returns 503
        when Event Hub isn't configured on the service, since there would
        be nothing to broadcast.
      operationId: getCasesIdActivitiesStream
      parameters:
        - name: id
          in: path
          description: UUID of the case.
          required: true
          schema:
            type: string
            format: uuid
        - name: x-user-id-token
          in: header
          description: >
            Forwarded to upstream entity-service calls as the caller's
            identity for per-case ACL checks. Optional — falls back to the
            x-jwt-assertion value itself when absent (see middleware.Auth).
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Ok
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "503":
          description: ServiceUnavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
components:
  securitySchemes:
    jwtAssertion:
      type: apiKey
      in: header
      name: x-jwt-assertion
      description: >
        Unlike the main :8080 REST API — where the browser sends
        Authorization: Bearer and Choreo's gateway translates it to
        x-jwt-assertion before this backend sees it — this listener's own
        Choreo endpoint is not guaranteed to apply the same translation, so
        the EventSource polyfill connecting to it sets x-jwt-assertion
        directly (native EventSource cannot set custom headers at all,
        which is why this stream uses a polyfill in the first place). See
        middleware.Auth, which reads this header directly.
  schemas:
    ErrorPayload:
      type: object
      properties:
        message:
          type: string
